[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optilang"
version = "0.1.0"
description = "A Python-inspired interpreter with real-time code analysis and optimization suggestions"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Manik Kumar Shrestha", email = "shresthamanik1820@gmail.com"}
]
keywords = ["interpreter", "optimization", "profiling", "static-analysis", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Education",
]

dependencies = [
    "ply>=3.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "mypy>=1.0.0",
    "flake8>=7.0.0",
]
ml = [
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/Sthamanik/optilang"
Documentation = "https://optilang.readthedocs.io"
Repository = "https://github.com/Sthamanik/optilang"
Issues = "https://github.com/Sthamanik/optilang/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=optilang --cov-report=html --cov-report=term"

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true