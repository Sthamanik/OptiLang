name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black>=26.1.0 flake8>=7.3.0 mypy>=1.19.1
    
    - name: Check formatting with Black
      run: black --check optilang/
    
    - name: Lint with Flake8
      run: flake8 optilang/ --max-line-length=88 --extend-ignore=E203,W503
    
    - name: Type check with MyPy
      run: mypy optilang/ --ignore-missing-imports
